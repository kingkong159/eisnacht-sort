name: Mod bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Minecraft-Klassen ansehen
        if: always()
        run: |
          for j in $(find ~/.gradle/caches -name "*.jar" -path "*minecraft*" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/multiplayer/MultiPlayerGameMode.class"; then
              echo "JAR: $j"
              javap -cp "$j" -p net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -i -E "click|creative|inventory" || true
              unzip -l "$j" | grep -E "net/minecraft/world/inventory/[A-Za-z]*(Click|Input|Action)[A-Za-z]*\.class" || true
              break
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EisNacht-Sortieren
          path: build/libs/*.jar
      - name: Fertige Mod in den Branch "fertig" legen
        run: |
          mkdir -p /tmp/out && cp build/libs/eisnacht-sort-*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan fertig
          git rm -rf . -q
          cp /tmp/out/*.jar .
          git add -f *.jar
          git commit -m "Fertige Mod"
          git push -f origin fertig
